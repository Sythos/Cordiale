name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

# A newer push to the same pull request supersedes the run in progress;
# every commit on main (and each scheduled scan) is still checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  # GitHub Actions workflows are code too: CodeQL checks them for things
  # like script injection and over-broad tokens. Separate job so the Rust
  # analysis keeps its name and category.
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
