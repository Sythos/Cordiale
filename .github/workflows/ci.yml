name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same pull request supersedes the run in progress;
# every commit on main (and each scheduled scan) is still checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-latest
          # macOS compiles the target_os = "macos" code before a release tag
          # does. Its runners are slower than Linux's (and billed at a higher
          # rate on private repos), so this leg is not a required check.
          - macos-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      # The audit reads only Cargo.lock, so it runs first: a new advisory fails
      # the job in about a minute, not after the build and the tests.
      - name: Install cargo-audit
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      # RUSTSEC-2024-0436 is an "unmaintained" notice for paste 1.0.15, a
      # proc-macro that runs at build time only. The only path is cordiale-ui ->
      # rusty_av1d 1.3.0 -> paste. rusty_av1d 1.3.0 is the latest release, so
      # Cordiale cannot replace paste (the advisory names pastey as a fork)
      # without a new rusty_av1d release or a different AV1 decoder. The ignore
      # covers this one identifier. The other ignores are in .cargo/audit.toml.
      # Remove the flag when rusty_av1d drops paste or moves to pastey.
      - name: Audit dependencies (RustSec advisory DB)
        if: runner.os == 'Linux'
        run: cargo audit --ignore RUSTSEC-2024-0436

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The mock-server tests open many local connections. Windows keeps each
      # closed one in TIME_WAIT, and the default range of 16384 ephemeral
      # ports can run out (bind fails with WSAENOBUFS, error 10055).
      - name: Widen the Windows ephemeral port range
        if: runner.os == 'Windows'
        run: netsh int ipv4 set dynamicport tcp start=10000 num=55536

      - name: Run workspace tests
        run: cargo test --workspace

      # The release packages declare their Linux dependencies from the same
      # script, so a new shared library has to fail here, not at release
      # time. `cargo test` builds no binary for this crate, hence the build.
      - name: Build binary for the dependency check
        if: runner.os == 'Linux'
        run: cargo build --package cordiale-ui

      - name: Check Linux runtime dependencies
        if: runner.os == 'Linux'
        run: bash packaging/check-linux-deps.sh target/debug/cordiale-ui

      - name: Upload Cargo.lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Cargo.lock
          path: Cargo.lock

  # The ctap-hid feature (USB security keys on Linux and macOS) is off in the
  # default build, so the verify job never compiles it. It builds hidapi's C
  # code. macOS runners are slower than Linux's, same note as in verify.
  ctap-hid:
    name: ctap-hid (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes             libasound2-dev             libfontconfig1-dev             libgl1-mesa-dev             libudev-dev             libxcb1-dev             libxcb-render0-dev             libxcb-shape0-dev             libxcb-xfixes0-dev             libxkbcommon-dev             libxkbcommon-x11-dev

      - name: Lint with Clippy (ctap-hid)
        run: cargo clippy --package cordiale-ui --all-targets --features ctap-hid -- -D warnings

      - name: Run tests (ctap-hid)
        run: cargo test --package cordiale-ui --features ctap-hid

  # The video-shrink feature (re-encoding a video before an upload) links
  # FFmpeg, so the default build never compiles it. Here it is checked
  # against the distribution's FFmpeg development packages.
  video-shrink:
    name: video-shrink (ubuntu-26.04)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Lint with Clippy (video-shrink)
        run: cargo clippy --package cordiale-core --all-targets --features video-shrink -- -D warnings

      - name: Run tests (video-shrink)
        run: cargo test --package cordiale-core --features video-shrink

  # The hw-decode feature (hardware video decoding in the media player) links
  # FFmpeg, so the default build never compiles it. Here it is checked against
  # the distribution's FFmpeg development packages. The runners have no video
  # hardware: the tests prove the software fallback.
  hw-decode:
    name: hw-decode (ubuntu-26.04)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang pkg-config libasound2-dev libfontconfig1-dev libgl1-mesa-dev libudev-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Lint with Clippy (hw-decode)
        run: cargo clippy --package cordiale-ui --all-targets --features hw-decode -- -D warnings

      - name: Run tests (hw-decode)
        run: cargo test --package cordiale-ui --features hw-decode media_

  # Windows x64 links FFmpeg statically from vcpkg, the same way as the release
  # package, so a missing system library (the Media Foundation GUID libraries
  # `mfuuid` and `strmiids`) fails here and not at the release tag. Windows
  # ARM64 shares the same link libraries and is covered by the release build.
  # The vcpkg build of FFmpeg is slow: its binary archives are cached, and a
  # cache miss only costs time. This job is not a required check.
  hw-decode-windows:
    name: hw-decode (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      # The runner image version is not in the `env` context, so the key uses
      # the hash of this file. A new key restores the archives of the previous
      # one through `restore-keys`.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: vcpkg-ffmpeg-${{ runner.os }}-x64-windows-static-md-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            vcpkg-ffmpeg-${{ runner.os }}-x64-windows-static-md-

      - name: Install FFmpeg with vcpkg
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-archives
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "ffmpeg:x64-windows-static-md"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"

      # This step links the static FFmpeg: it is the point of the job.
      - name: Build binary (hw-decode)
        shell: pwsh
        run: |
          cargo build --package cordiale-ui --features hw-decode
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build failed with exit code $LASTEXITCODE"
          }

      - name: Lint with Clippy (hw-decode)
        run: cargo clippy --package cordiale-ui --all-targets --features hw-decode -- -D warnings

      - name: Run tests (hw-decode)
        run: cargo test --package cordiale-ui --features hw-decode media_

  # Same check on macOS against Homebrew's FFmpeg. Its runners are slower than
  # Linux's, so this job is not a required check.
  hw-decode-macos:
    name: hw-decode (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install FFmpeg with Homebrew
        shell: bash
        run: |
          # The runner image already has pkgconf, so install only ffmpeg.
          brew list --versions pkgconf > /dev/null || brew install pkgconf
          brew install ffmpeg

      # A macOS test link can print "__eh_frame section too large (max 16MB)
      # ... compact unwind table". The linker then uses the slower DWARF lookup
      # when it unwinds an exception. The tests pass. The warning is about the
      # debug test binary only: the release binary is a separate link (lto,
      # strip). The exact object files are not traced. Keep the warning visible.
      # The same warning can appear in the macOS leg of the verify job. The list
      # of all known warnings is in docs/ci-warnings.md.
      - name: Lint with Clippy (hw-decode)
        run: cargo clippy --package cordiale-ui --all-targets --features hw-decode -- -D warnings

      - name: Run tests (hw-decode)
        run: cargo test --package cordiale-ui --features hw-decode media_
