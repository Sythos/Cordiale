name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same pull request supersedes the run in progress;
# every commit on main (and each scheduled scan) is still checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-latest
          # macOS compiles the target_os = "macos" code before a release tag
          # does. Its runners are slower than Linux's (and billed at a higher
          # rate on private repos), so this leg is not a required check.
          - macos-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      # The release packages declare their Linux dependencies from the same
      # script, so a new shared library has to fail here, not at release
      # time. `cargo test` builds no binary for this crate, hence the build.
      - name: Build binary for the dependency check
        if: runner.os == 'Linux'
        run: cargo build --package cordiale-ui

      - name: Check Linux runtime dependencies
        if: runner.os == 'Linux'
        run: bash packaging/check-linux-deps.sh target/debug/cordiale-ui

      - name: Install cargo-audit
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit

      - name: Audit dependencies (RustSec advisory DB)
        if: runner.os == 'Linux'
        run: cargo audit

      - name: Upload Cargo.lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Cargo.lock
          path: Cargo.lock

  # The ctap-hid feature (USB security keys on Linux and macOS) is off in the
  # default build, so the verify job never compiles it. It builds hidapi's C
  # code. macOS runners are slower than Linux's, same note as in verify.
  ctap-hid:
    name: ctap-hid (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes             libasound2-dev             libfontconfig1-dev             libgl1-mesa-dev             libudev-dev             libxcb1-dev             libxcb-render0-dev             libxcb-shape0-dev             libxcb-xfixes0-dev             libxkbcommon-dev             libxkbcommon-x11-dev

      - name: Lint with Clippy (ctap-hid)
        run: cargo clippy --package cordiale-ui --all-targets --features ctap-hid -- -D warnings

      - name: Run tests (ctap-hid)
        run: cargo test --package cordiale-ui --features ctap-hid

  # The video-shrink feature (re-encoding a video before an upload) links
  # FFmpeg, so the default build never compiles it. Here it is checked
  # against the distribution's FFmpeg development packages.
  video-shrink:
    name: video-shrink (ubuntu-26.04)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Lint with Clippy (video-shrink)
        run: cargo clippy --package cordiale-core --all-targets --features video-shrink -- -D warnings

      - name: Run tests (video-shrink)
        run: cargo test --package cordiale-core --features video-shrink
