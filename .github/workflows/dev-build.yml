name: Dev Build

# Manually-triggered, Windows x64 only: a quick installer for field
# testing between real releases, not a substitute for the tagged
# `packages.yml` pipeline (which still builds every platform and
# publishes a GitHub Release on a `v*` tag). Never runs on a push/tag —
# `workflow_dispatch` only, so it can't be triggered by accident.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-dev:
    name: windows-x64-dev
    runs-on: windows-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve latest tag and DEV build version
        id: metadata
        shell: pwsh
        run: |
          $latestTag = git tag --list 'v[0-9]*' --sort=-version:refname |
            Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
            Select-Object -First 1
          if ($latestTag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Expected a stable vMAJOR.MINOR.PATCH tag, got: $latestTag"
          }
          $baseVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $versionParts = $baseVersion.Split('.')
          if (@($versionParts | Where-Object { [long]$_ -gt 65535 }).Count -gt 0) {
            throw "Windows VERSIONINFO tag components must not exceed 65535: $baseVersion"
          }

          $buildId = [long]$env:GITHUB_RUN_ID
          $buildAttempt = [long]$env:GITHUB_RUN_ATTEMPT
          if ($buildId -le 0 -or $buildAttempt -lt 1) {
            throw "Invalid GitHub Actions run ID/attempt: $buildId/$buildAttempt"
          }
          # The remainder is equivalent to repeatedly subtracting 65535,
          # while avoiding a long loop for the repository-wide GitHub run ID.
          $windowsBuildComponent = $buildId % 65535
          $packageVersion = "$baseVersion.$buildId-dev"
          $productVersion = "$baseVersion.$windowsBuildComponent"

          @(
            "base_version=$baseVersion"
            "package_version=$packageVersion"
            "build_id=$buildId"
            "build_attempt=$buildAttempt"
            "windows_build_component=$windowsBuildComponent"
            "product_version=$productVersion"
          ) | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Install stable Rust and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Generate Windows .ico from source PNG
        shell: pwsh
        run: magick resources\branding\cordiale_icona.png -define icon:auto-resize="256,48,32,16" resources\branding\cordiale.ico

      - name: Build release binary
        shell: bash
        run: cargo build --release --package cordiale-ui --target x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Package Windows DEV installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          BUILD_ID: ${{ steps.metadata.outputs.build_id }}
          BUILD_ATTEMPT: ${{ steps.metadata.outputs.build_attempt }}
          PRODUCT_VERSION: ${{ steps.metadata.outputs.product_version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $binPath = "target\x86_64-pc-windows-msvc\release\cordiale-ui.exe"

          $candidates = @(
            (Get-Command makensis -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe",
            "${env:ChocolateyInstall}\lib\NSIS\tools\makensis.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $makensis = $candidates | Select-Object -First 1
          if (-not $makensis) {
            $found = Get-ChildItem -Path "${env:ProgramFiles}", "${env:ProgramFiles(x86)}", "${env:ChocolateyInstall}" `
              -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $makensis = $found.FullName }
          }
          if (-not $makensis) {
            throw "makensis.exe not found on this runner"
          }

          $outFile = "$PWD\dist\Cordiale_Windows_x64_DEV_$($env:PACKAGE_VERSION).exe"
          $iconPath = "$PWD\resources\branding\cordiale.ico"
          & $makensis "/DBIN_PATH=$PWD\$binPath" "/DOUT_FILE=$outFile" "/DVERSION=$env:PACKAGE_VERSION" "/DBUILD_ID=$env:BUILD_ID" "/DBUILD_ATTEMPT=$env:BUILD_ATTEMPT" "/DPRODUCT_VERSION=$env:PRODUCT_VERSION" "/DICON_PATH=$iconPath" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Path "dist\SHA256SUMS-windows-x64-dev" -Encoding ascii

      - name: Upload DEV installer
        uses: actions/upload-artifact@v7
        with:
          name: cordiale-windows-x64-dev-${{ steps.metadata.outputs.package_version }}-attempt-${{ steps.metadata.outputs.build_attempt }}
          path: dist/*
