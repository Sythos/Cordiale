name: Dev Build

# Manually-triggered: a quick installer (Windows x64) and tester builds
# with hardware video decoding (Linux, Windows, macOS), for field testing between real
# releases, not a substitute for the tagged
# `packages.yml` pipeline (which still builds every platform and
# publishes a GitHub Release on a `v*` tag). Never runs on a push/tag —
# `workflow_dispatch` only, so it can't be triggered by accident.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-dev:
    name: windows-x64-dev
    runs-on: windows-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest tag and DEV build version
        id: metadata
        shell: pwsh
        run: |
          $latestTag = git tag --list 'v[0-9]*' --sort=-version:refname |
            Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
            Select-Object -First 1
          if ($latestTag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Expected a stable vMAJOR.MINOR.PATCH tag, got: $latestTag"
          }
          $baseVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $versionParts = $baseVersion.Split('.')
          if (@($versionParts | Where-Object { [long]$_ -gt 65535 }).Count -gt 0) {
            throw "Windows VERSIONINFO tag components must not exceed 65535: $baseVersion"
          }

          $buildId = [long]$env:GITHUB_RUN_ID
          $buildAttempt = [long]$env:GITHUB_RUN_ATTEMPT
          if ($buildId -le 0 -or $buildAttempt -lt 1) {
            throw "Invalid GitHub Actions run ID/attempt: $buildId/$buildAttempt"
          }
          # The remainder is equivalent to repeatedly subtracting 65535,
          # while avoiding a long loop for the repository-wide GitHub run ID.
          $windowsBuildComponent = $buildId % 65535
          $packageVersion = "$baseVersion.$buildId-dev"
          $productVersion = "$baseVersion.$windowsBuildComponent"

          @(
            "base_version=$baseVersion"
            "package_version=$packageVersion"
            "build_id=$buildId"
            "build_attempt=$buildAttempt"
            "windows_build_component=$windowsBuildComponent"
            "product_version=$productVersion"
          ) | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Install stable Rust and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Generate Windows .ico from source PNG
        shell: pwsh
        run: magick resources\branding\cordiale_icona.png -define icon:auto-resize="256,48,32,16" resources\branding\cordiale.ico

      - name: Build release binary
        shell: bash
        env:
          # Baked into the Grappa User-Agent by cordiale-core's build.rs.
          BUILD_ID: ${{ steps.metadata.outputs.build_id }}
        run: cargo build --release --package cordiale-ui --target x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Package Windows DEV installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          BUILD_ID: ${{ steps.metadata.outputs.build_id }}
          BUILD_ATTEMPT: ${{ steps.metadata.outputs.build_attempt }}
          PRODUCT_VERSION: ${{ steps.metadata.outputs.product_version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $binPath = "target\x86_64-pc-windows-msvc\release\cordiale-ui.exe"

          $candidates = @(
            (Get-Command makensis -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe",
            "${env:ChocolateyInstall}\lib\NSIS\tools\makensis.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $makensis = $candidates | Select-Object -First 1
          if (-not $makensis) {
            $found = Get-ChildItem -Path "${env:ProgramFiles}", "${env:ProgramFiles(x86)}", "${env:ChocolateyInstall}" `
              -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $makensis = $found.FullName }
          }
          if (-not $makensis) {
            throw "makensis.exe not found on this runner"
          }

          $outFile = "$PWD\dist\Cordiale_Windows_x64_DEV_$($env:PACKAGE_VERSION).exe"
          $iconPath = "$PWD\resources\branding\cordiale.ico"
          & $makensis "/DBIN_PATH=$PWD\$binPath" "/DOUT_FILE=$outFile" "/DVERSION=$env:PACKAGE_VERSION" "/DBUILD_ID=$env:BUILD_ID" "/DBUILD_ATTEMPT=$env:BUILD_ATTEMPT" "/DPRODUCT_VERSION=$env:PRODUCT_VERSION" "/DICON_PATH=$iconPath" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Path "dist\SHA256SUMS-windows-x64-dev" -Encoding ascii

      - name: Upload DEV installer
        uses: actions/upload-artifact@v7
        with:
          name: cordiale-windows-x64-dev-${{ steps.metadata.outputs.package_version }}-attempt-${{ steps.metadata.outputs.build_attempt }}
          path: dist/*

  # Field-test build for the media player checks (docs/media-playback.md).
  # It turns on the `hw-decode` feature, which links the FFmpeg shared
  # libraries of the runner. The tarball is NOT a release package: the
  # tester needs the FFmpeg libraries of a matching distribution release.
  linux-x64-hw-dev:
    name: linux-x64-hw-dev
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang pkg-config libasound2-dev libfontconfig1-dev libgl1-mesa-dev libudev-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Build release binary with hardware decoding
        shell: bash
        env:
          # Baked into the Grappa User-Agent by cordiale-core's build.rs.
          BUILD_ID: ${{ github.run_id }}
        run: cargo build --release --package cordiale-ui --features hw-decode

      - name: Package tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="cordiale-linux-x64-hw-dev-${GITHUB_RUN_ID}"
          tar -czf "dist/${name}.tar.gz" -C target/release cordiale-ui
          (cd dist && sha256sum "${name}.tar.gz" > "SHA256SUMS-linux-x64-hw-dev")

      - name: Upload tester build
        uses: actions/upload-artifact@v7
        with:
          name: cordiale-linux-x64-hw-dev-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: dist/*

  # Field-test build for the media player checks on Windows. FFmpeg comes
  # from vcpkg with the static triplet that uses the dynamic C runtime, so the
  # executable has no FFmpeg DLL next to it. Hardware decoding uses D3D11VA
  # and DXVA2. The zip is NOT a release package: it has no installer.
  windows-x64-hw-dev:
    name: windows-x64-hw-dev
    runs-on: windows-latest

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install FFmpeg with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install ffmpeg:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg install failed with exit code $LASTEXITCODE"
          }

      - name: Build release binary with hardware decoding
        shell: pwsh
        env:
          # Baked into the Grappa User-Agent by cordiale-core's build.rs.
          BUILD_ID: ${{ github.run_id }}
          VCPKGRS_TRIPLET: x64-windows-static-md
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cargo build --release --package cordiale-ui --features hw-decode
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build failed with exit code $LASTEXITCODE"
          }

      - name: Package zip and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $name = "cordiale-windows-x64-hw-dev-$($env:GITHUB_RUN_ID)"
          Compress-Archive -Path target\release\cordiale-ui.exe -DestinationPath "dist\$name.zip"
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Path "dist\SHA256SUMS-windows-x64-hw-dev" -Encoding ascii

      - name: Upload tester build
        uses: actions/upload-artifact@v7
        with:
          name: cordiale-windows-x64-hw-dev-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: dist/*

  # Field-test build for the media player checks on macOS (ARM64 and x64).
  # It turns on the `hw-decode` feature, which links the FFmpeg shared
  # libraries of Homebrew. Hardware decoding uses VideoToolbox. The tarball is
  # NOT a release package: the tester installs the same FFmpeg with Homebrew.
  macos-hw-dev:
    name: macos-hw-dev (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install FFmpeg with Homebrew
        shell: bash
        run: |
          # The runner image already has pkgconf, so install only ffmpeg.
          brew list --versions pkgconf > /dev/null || brew install pkgconf
          brew install ffmpeg

      - name: Build release binary with hardware decoding
        shell: bash
        env:
          # Baked into the Grappa User-Agent by cordiale-core's build.rs.
          BUILD_ID: ${{ github.run_id }}
        run: cargo build --release --package cordiale-ui --features hw-decode

      - name: Package tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="cordiale-macos-${{ matrix.arch }}-hw-dev-${GITHUB_RUN_ID}"
          tar -czf "dist/${name}.tar.gz" -C target/release cordiale-ui
          (cd dist && shasum -a 256 "${name}.tar.gz" > "SHA256SUMS-macos-${{ matrix.arch }}-hw-dev")

      - name: Upload tester build
        uses: actions/upload-artifact@v7
        with:
          name: cordiale-macos-${{ matrix.arch }}-hw-dev-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: dist/*
