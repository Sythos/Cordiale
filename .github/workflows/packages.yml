name: Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-package:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: linux-x64
            deb_arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: linux-arm64
            deb_arch: arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: windows-x64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            artifact: windows-arm64

    steps:
      - name: Checkout client
        uses: actions/checkout@v4

      - name: Resolve artifact version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install stable Rust and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "${GITHUB_ENV}"

      - name: Build release binary
        shell: bash
        run: cargo build --release --package cordiale-ui --target "${{ matrix.target }}"

      - name: Package Linux tarball and Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist deb-root/usr/bin deb-root/DEBIAN
          cp "target/${TARGET}/release/cordiale-ui" deb-root/usr/bin/cordiale
          chmod 0755 deb-root/usr/bin/cordiale
          cat > deb-root/DEBIAN/control <<EOF
          Package: cordiale
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: Sythos <sythos@gmail.com>
          Description: Native desktop client for Grappa
           Cordiale connects to Grappa through its documented client protocol.
          EOF
          dpkg-deb --build deb-root "dist/cordiale-${ARTIFACT}-${VERSION}.deb"
          tar -czf "dist/cordiale-${ARTIFACT}-${VERSION}.tar.gz" \
            -C "target/${TARGET}/release" cordiale-ui

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive `
            -Path "target\$env:TARGET\release\cordiale-ui.exe" `
            -DestinationPath "dist\cordiale-$env:ARTIFACT-$env:VERSION.zip" `
            -Force

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cordiale-${{ matrix.artifact }}-${{ steps.version.outputs.version }}
          path: dist/*
