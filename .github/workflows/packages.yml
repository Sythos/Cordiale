name: Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-metadata:
    name: build-metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      build_id: ${{ steps.metadata.outputs.build_id }}
      build_attempt: ${{ steps.metadata.outputs.build_attempt }}
      windows_build_component: ${{ steps.metadata.outputs.windows_build_component }}
      mac_bundle_version: ${{ steps.metadata.outputs.mac_bundle_version }}

    steps:
      - name: Checkout repository tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release and build versions
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            source_tag="${GITHUB_REF_NAME}"
          else
            source_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          fi
          if [[ ! "${source_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag, got: ${source_tag}" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

          if [[ ! "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid GitHub Actions run ID: ${GITHUB_RUN_ID}" >&2
            exit 1
          fi
          if (( GITHUB_RUN_ATTEMPT < 1 )); then
            echo "Invalid workflow run attempt: ${GITHUB_RUN_ATTEMPT}" >&2
            exit 1
          fi

          # GITHUB_RUN_ID is unique across workflows in this repository. A
          # rerun keeps the same build ID; its attempt remains separate.
          build_id="${GITHUB_RUN_ID}"
          build_attempt="${GITHUB_RUN_ATTEMPT}"
          package_version="${version}.${build_id}"

          # Windows VERSIONINFO components are 16-bit. Modulo is equivalent
          # to the approved repeated subtraction, while avoiding a huge loop.
          windows_build_component=$((build_id % 65535))

          # CFBundleVersion allows only three numeric components (4/2/2
          # digits). Keep a compact, valid build version there and record the
          # exact GitHub run ID in CordialeBuildID and CordialeBuildVersion.
          mac_code=$((build_id % 99990000 + 10000))
          mac_major=$((mac_code / 10000))
          mac_minor=$(((mac_code / 100) % 100))
          mac_patch=$((mac_code % 100))
          mac_bundle_version="${mac_major}.${mac_minor}.${mac_patch}"

          {
            echo "version=${version}"
            echo "package_version=${package_version}"
            echo "build_id=${build_id}"
            echo "build_attempt=${build_attempt}"
            echo "windows_build_component=${windows_build_component}"
            echo "mac_bundle_version=${mac_bundle_version}"
          } >> "${GITHUB_OUTPUT}"

  build-and-package:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    needs: build-metadata
    env:
      VERSION: ${{ needs.build-metadata.outputs.version }}
      PACKAGE_VERSION: ${{ needs.build-metadata.outputs.package_version }}
      BUILD_ID: ${{ needs.build-metadata.outputs.build_id }}
      BUILD_ATTEMPT: ${{ needs.build-metadata.outputs.build_attempt }}
      WINDOWS_BUILD_COMPONENT: ${{ needs.build-metadata.outputs.windows_build_component }}
      MAC_BUNDLE_VERSION: ${{ needs.build-metadata.outputs.mac_bundle_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Deliberately NOT ubuntu-26.04 (glibc 2.43): this build's
            # binary ships as-is in the Debian 13 Trixie (glibc 2.41) and
            # generic-tarball packages below. ubuntu-24.04's glibc 2.39 is
            # older than every package this workflow ships to, so the
            # binary runs everywhere; building on 26.04 would raise the
            # minimum glibc requirement past what Trixie has and break
            # that package.
            runner: ubuntu-24.04
            artifact: linux-x64
            deb_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            artifact: linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: windows-x64
            win_arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            artifact: windows-arm64
            win_arch: arm64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: macos-arm64

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Install stable Rust and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux' && matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cross

      - name: Generate Windows .ico from source PNG
        if: runner.os == 'Windows'
        shell: pwsh
        run: magick resources\branding\cordiale_icona.png -define icon:auto-resize="256,48,32,16" resources\branding\cordiale.ico

      - name: Build release binary (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: cargo build --release --package cordiale-ui --target "${{ matrix.target }}"

      - name: Build release binary (cross, aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: cross build --release --package cordiale-ui --target "${{ matrix.target }}"

      - name: Install fpm and Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ruby ruby-dev build-essential rpm libarchive-tools zstd imagemagick
          sudo gem install --no-document fpm

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          set -euo pipefail
          mkdir -p dist stage/usr/bin
          cp "target/${TARGET}/release/cordiale-ui" stage/usr/bin/cordiale
          chmod 0755 stage/usr/bin/cordiale

          mkdir -p stage/usr/share/icons/hicolor/256x256/apps stage/usr/share/applications
          convert resources/branding/cordiale_icona.png -resize 256x256 \
            stage/usr/share/icons/hicolor/256x256/apps/cordiale.png

          cat > stage/usr/share/applications/cordiale.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Cordiale
          Comment=Native desktop client for Grappa
          Exec=cordiale
          Icon=cordiale
          Terminal=false
          Categories=Network;InstantMessaging;Chat;
          DESKTOP

          tar -czf "dist/cordiale-linux-${DEB_ARCH}-${PACKAGE_VERSION}.tar.gz" \
            -C "target/${TARGET}/release" cordiale-ui

          # RPM/pacman version fields reject "-"; deb accepts it fine.
          RPM_VERSION="${PACKAGE_VERSION//-/_}"

          fpm -s dir -t deb -n cordiale -v "${PACKAGE_VERSION}" -a "${DEB_ARCH}" \
            --maintainer "Sythos <sythos@gmail.com>" \
            --description "Native desktop client for Grappa" \
            --url "https://github.com/Sythos/Cordiale" \
            --license MIT \
            -C stage -p "dist/Cordiale_Debian_13_${DEB_ARCH}.deb" .
          # Same package content for Debian 13 and Ubuntu 26.04: identical
          # format, dependencies and target glibc floor.
          cp "dist/Cordiale_Debian_13_${DEB_ARCH}.deb" "dist/Cordiale_Ubuntu_26.04_${DEB_ARCH}.deb"

          fpm -s dir -t rpm -n cordiale -v "${RPM_VERSION}" -a "${RPM_ARCH}" \
            --maintainer "Sythos <sythos@gmail.com>" \
            --description "Native desktop client for Grappa" \
            --url "https://github.com/Sythos/Cordiale" \
            --license MIT \
            -C stage -p "dist/Cordiale_AlmaLinux_10_${RPM_ARCH}.rpm" .

          fpm -s dir -t pacman -n cordiale -v "${RPM_VERSION}" -a "${RPM_ARCH}" \
            --pacman-compression zstd \
            --maintainer "Sythos <sythos@gmail.com>" \
            --description "Native desktop client for Grappa" \
            --url "https://github.com/Sythos/Cordiale" \
            --license MIT \
            -C stage -p "dist/Cordiale_Arch_rolling_${RPM_ARCH}.pkg.tar.zst" .

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Package Windows archive and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          WIN_ARCH: ${{ matrix.win_arch }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $binPath = "target\$env:TARGET\release\cordiale-ui.exe"

          Compress-Archive -Path $binPath -DestinationPath "dist\cordiale-$($env:ARTIFACT)-$($env:PACKAGE_VERSION).zip" -Force

          $candidates = @(
            (Get-Command makensis -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe",
            "${env:ChocolateyInstall}\lib\NSIS\tools\makensis.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $makensis = $candidates | Select-Object -First 1
          if (-not $makensis) {
            $found = Get-ChildItem -Path "${env:ProgramFiles}", "${env:ProgramFiles(x86)}", "${env:ChocolateyInstall}" `
              -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $makensis = $found.FullName }
          }
          if (-not $makensis) {
            throw "makensis.exe not found on this runner"
          }
          $outFile = "$PWD\dist\Cordiale_Windows_$($env:WIN_ARCH).exe"
          $iconPath = "$PWD\resources\branding\cordiale.ico"
          # NSIS VERSIONINFO accepts four 16-bit numeric components. The
          # fourth component is the reduced GitHub run ID; string keys retain
          # the full run ID and the attempt number separately.
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must be a three-part numeric tag version: $env:VERSION"
          }
          $versionParts = $env:VERSION.Split('.')
          if (@($versionParts | Where-Object { [long]$_ -gt 65535 }).Count -gt 0) {
            throw "NSIS VERSIONINFO tag components must not exceed 65535: $env:VERSION"
          }
          $windowsBuildComponent = [int]$env:WINDOWS_BUILD_COMPONENT
          if ($windowsBuildComponent -lt 0 -or $windowsBuildComponent -ge 65535) {
            throw "Reduced Windows build component must be below 65535: $windowsBuildComponent"
          }
          $productVersion = "$($env:VERSION).$windowsBuildComponent"
          & $makensis "/DBIN_PATH=$PWD\$binPath" "/DOUT_FILE=$outFile" "/DVERSION=$env:PACKAGE_VERSION" "/DBUILD_ID=$env:BUILD_ID" "/DBUILD_ATTEMPT=$env:BUILD_ATTEMPT" "/DPRODUCT_VERSION=$productVersion" "/DICON_PATH=$iconPath" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Package macOS archive and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/cordiale-macos-arm64-${PACKAGE_VERSION}.tar.gz" \
            -C target/aarch64-apple-darwin/release cordiale-ui

          APP_DIR="macos-app-stage/Cordiale.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp target/aarch64-apple-darwin/release/cordiale-ui "$APP_DIR/Contents/MacOS/cordiale-ui"
          chmod +x "$APP_DIR/Contents/MacOS/cordiale-ui"

          ICONSET="Cordiale.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16 resources/branding/cordiale_icona.png --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 resources/branding/cordiale_icona.png --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 resources/branding/cordiale_icona.png --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 resources/branding/cordiale_icona.png --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 resources/branding/cordiale_icona.png --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 resources/branding/cordiale_icona.png --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 resources/branding/cordiale_icona.png --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 resources/branding/cordiale_icona.png --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 resources/branding/cordiale_icona.png --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 resources/branding/cordiale_icona.png --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o Cordiale.icns
          cp Cordiale.icns "$APP_DIR/Contents/Resources/Cordiale.icns"

          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>cordiale-ui</string>
              <key>CFBundleIconFile</key>
              <string>Cordiale</string>
              <key>CFBundleIdentifier</key>
              <string>com.sythos.cordiale</string>
              <key>CFBundleName</key>
              <string>Cordiale</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>${MAC_BUNDLE_VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CordialeBuildID</key>
              <string>${BUILD_ID}</string>
              <key>CordialeBuildAttempt</key>
              <string>${BUILD_ATTEMPT}</string>
              <key>CordialeBuildVersion</key>
              <string>${PACKAGE_VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          PLIST

          hdiutil create -volname "Cordiale" -srcfolder "macos-app-stage" \
            -ov -format UDZO "dist/Cordiale_macOS_arm64.dmg"

      - name: Generate checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: dist
        run: sha256sum * > "SHA256SUMS-${{ matrix.artifact }}"

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Path "dist\SHA256SUMS-${{ matrix.artifact }}" -Encoding ascii

      - name: Generate checksums (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: dist
        run: shasum -a 256 * > "SHA256SUMS-${{ matrix.artifact }}"

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cordiale-${{ matrix.artifact }}-${{ needs.build-metadata.outputs.package_version }}-attempt-${{ needs.build-metadata.outputs.build_attempt }}
          path: dist/*

  source-archive:
    name: source-archive
    runs-on: ubuntu-26.04
    needs: build-metadata
    env:
      VERSION: ${{ needs.build-metadata.outputs.version }}
      PACKAGE_VERSION: ${{ needs.build-metadata.outputs.package_version }}
      BUILD_ID: ${{ needs.build-metadata.outputs.build_id }}
      BUILD_ATTEMPT: ${{ needs.build-metadata.outputs.build_attempt }}

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz "--prefix=cordiale-${PACKAGE_VERSION}/" \
            -o "dist/Cordiale_src.tar.gz" HEAD

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: sha256sum * > SHA256SUMS-src

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: cordiale-src-${{ needs.build-metadata.outputs.package_version }}-attempt-${{ needs.build-metadata.outputs.build_attempt }}
          path: dist/*

  create-release:
    name: create-release
    needs: [build-metadata, build-and-package, source-archive]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*/*
          generate_release_notes: true
          body: |
            Cordiale package version: `${{ needs.build-metadata.outputs.package_version }}` (tag version `${{ needs.build-metadata.outputs.version }}`, GitHub Actions run ID `${{ needs.build-metadata.outputs.build_id }}`, attempt `${{ needs.build-metadata.outputs.build_attempt }}`).

            Where four numeric components are supported, the fourth is the GitHub Actions run ID. Windows VERSIONINFO stores its reduction below 65535 in the numeric component and preserves the full ID in string metadata. macOS keeps the tag in `CFBundleShortVersionString`, uses a valid compact `CFBundleVersion`, and records the full run ID in `CordialeBuildID` and `CordialeBuildVersion`.

            Tester note: Cordiale handles all 56 currently inventoried Grappa event kinds. Only message events are rendered as chat lines; see the README for behavior and current limitations.

            Heads up: every package here is unsigned, on every platform — no code-signing cert anywhere, even though the filenames don't say so. Windows SmartScreen and some Linux package managers might complain about it; that's expected for an unsigned, community-built app, not a sign of tampering. Each artifact still ships a SHA256SUMS file and a build provenance attestation if you want to verify it yourself — see [docs/installation.md](https://github.com/Sythos/Cordiale/blob/main/docs/installation.md).
