name: Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-package:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            artifact: linux-x64
            deb_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04
            artifact: linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: windows-x64
            win_arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            artifact: windows-arm64
            win_arch: arm64
          - target: universal-apple-darwin
            runner: macos-latest
            artifact: macos-universal

    steps:
      - name: Checkout client
        uses: actions/checkout@v5

      - name: Resolve artifact version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install stable Rust and target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          else
            rustup target add "${{ matrix.target }}"
          fi

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux' && matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary (native)
        if: runner.os != 'macOS' && matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: cargo build --release --package cordiale-ui --target "${{ matrix.target }}"

      - name: Build release binary (cross, aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: cross build --release --package cordiale-ui --target "${{ matrix.target }}"

      - name: Build release binary (macOS universal)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --package cordiale-ui --target x86_64-apple-darwin
          cargo build --release --package cordiale-ui --target aarch64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/cordiale-ui \
            target/aarch64-apple-darwin/release/cordiale-ui \
            -output target/universal-apple-darwin/release/cordiale-ui

      - name: Install fpm and Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ruby ruby-dev build-essential rpm libarchive-tools zstd
          sudo gem install --no-document fpm

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist stage/usr/bin
          cp "target/${TARGET}/release/cordiale-ui" stage/usr/bin/cordiale
          chmod 0755 stage/usr/bin/cordiale

          tar -czf "dist/cordiale-linux-${DEB_ARCH}-${VERSION}.tar.gz" \
            -C "target/${TARGET}/release" cordiale-ui

          # RPM/pacman version fields reject "-"; deb accepts it fine.
          RPM_VERSION="${VERSION//-/_}"

          fpm -s dir -t deb -n cordiale -v "${VERSION}" -a "${DEB_ARCH}" \
            --maintainer "Sythos <sythos@gmail.com>" \
            --description "Native desktop client for Grappa" \
            --url "https://github.com/Sythos/Cordiale" \
            --license MIT \
            -C stage -p "dist/Cordiale_Debian_13_${DEB_ARCH}.deb" .
          # Same package content for Debian 13 and Ubuntu 26.04: identical
          # format, dependencies and target glibc floor — see MEMORY.md.
          cp "dist/Cordiale_Debian_13_${DEB_ARCH}.deb" "dist/Cordiale_Ubuntu_26.04_${DEB_ARCH}.deb"

          fpm -s dir -t rpm -n cordiale -v "${RPM_VERSION}" -a "${RPM_ARCH}" \
            --maintainer "Sythos <sythos@gmail.com>" \
            --description "Native desktop client for Grappa" \
            --url "https://github.com/Sythos/Cordiale" \
            --license MIT \
            -C stage -p "dist/Cordiale_AlmaLinux_10_${RPM_ARCH}.rpm" .

          fpm -s dir -t pacman -n cordiale -v "${RPM_VERSION}" -a "${RPM_ARCH}" \
            --pacman-compression zstd \
            --maintainer "Sythos <sythos@gmail.com>" \
            --description "Native desktop client for Grappa" \
            --url "https://github.com/Sythos/Cordiale" \
            --license MIT \
            -C stage -p "dist/Cordiale_Arch_rolling_${RPM_ARCH}.pkg.tar.zst" .

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Package Windows archive and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          WIN_ARCH: ${{ matrix.win_arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $binPath = "target\$env:TARGET\release\cordiale-ui.exe"

          Compress-Archive -Path $binPath -DestinationPath "dist\cordiale-$env:ARTIFACT-$env:VERSION.zip" -Force

          $candidates = @(
            (Get-Command makensis -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe",
            "${env:ChocolateyInstall}\lib\NSIS\tools\makensis.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $makensis = $candidates | Select-Object -First 1
          if (-not $makensis) {
            $found = Get-ChildItem -Path "${env:ProgramFiles}", "${env:ProgramFiles(x86)}", "${env:ChocolateyInstall}" `
              -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $makensis = $found.FullName }
          }
          if (-not $makensis) {
            throw "makensis.exe not found on this runner"
          }
          $outFile = "$PWD\dist\Cordiale_Windows_$env:WIN_ARCH.exe"
          & $makensis "/DBIN_PATH=$PWD\$binPath" "/DOUT_FILE=$outFile" "/DVERSION=$env:VERSION" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Package macOS archive and disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/cordiale-macos-universal-${VERSION}.tar.gz" \
            -C target/universal-apple-darwin/release cordiale-ui

          APP_DIR="macos-app-stage/Cordiale.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          cp target/universal-apple-darwin/release/cordiale-ui "$APP_DIR/Contents/MacOS/cordiale-ui"
          chmod +x "$APP_DIR/Contents/MacOS/cordiale-ui"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>cordiale-ui</string>
              <key>CFBundleIdentifier</key>
              <string>com.sythos.cordiale</string>
              <key>CFBundleName</key>
              <string>Cordiale</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          PLIST

          hdiutil create -volname "Cordiale" -srcfolder "macos-app-stage" \
            -ov -format UDZO "dist/Cordiale_macOS_universal.dmg"

      - name: Generate checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: dist
        run: sha256sum * > "SHA256SUMS-${{ matrix.artifact }}"

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Path "dist\SHA256SUMS-${{ matrix.artifact }}" -Encoding ascii

      - name: Generate checksums (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: dist
        run: shasum -a 256 * > "SHA256SUMS-${{ matrix.artifact }}"

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cordiale-${{ matrix.artifact }}-${{ steps.version.outputs.version }}
          path: dist/*

  source-archive:
    name: source-archive
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout client
        uses: actions/checkout@v5

      - name: Resolve artifact version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build source archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz "--prefix=cordiale-${VERSION}/" \
            -o "dist/Cordiale_src.tar.gz" HEAD

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: sha256sum * > SHA256SUMS-src

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload source archive
        uses: actions/upload-artifact@v6
        with:
          name: cordiale-src-${{ steps.version.outputs.version }}
          path: dist/*

  create-release:
    name: create-release
    needs: [build-and-package, source-archive]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          generate_release_notes: true
          body: |
            Heads up: every package here is unsigned, on every platform — no code-signing cert anywhere, even though the filenames don't say so. Windows SmartScreen and some Linux package managers might complain about it; that's expected for an unsigned, community-built app, not a sign of tampering. Each artifact still ships a SHA256SUMS file and a build provenance attestation if you want to verify it yourself — see [docs/installation.md](https://github.com/Sythos/Cordiale/blob/main/docs/installation.md).
