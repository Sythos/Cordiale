version: 2
updates:
  # Rust crates of the workspace (Cargo.toml / Cargo.lock at the root).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
