[package]
name = "cordiale-ui"
version = "0.1.6"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
cordiale-core = { path = "../cordiale-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
rfd = "0.17"
# Not used directly: enabling these formats on the `image` crate Slint
# already decodes with lets `slint::Image` load GIF, WebP and BMP avatars.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "bmp"] }
# Slint's defaults minus `system-tray`, which Cordiale doesn't use.
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# The radio player: MP3, Ogg Vorbis and FLAC streams, decoded the same way
# on every platform (ALSA on Linux, WASAPI on Windows, CoreAudio on macOS).
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "vorbis", "flac"] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"
