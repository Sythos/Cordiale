[package]
name = "cordiale-ui"
version = "1.0.17"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
cordiale-core = { path = "../cordiale-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
# base64url for the WebAuthn wire bodies (already in the tree via the core).
base64 = "0.23"
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.18"
# GIF, WebP and BMP let `slint::Image` (which decodes with this crate) load
# those avatars; PNG encodes images pasted from the clipboard.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "bmp", "png", "ico"] }
# Images and text on the system clipboard, for pasting uploads.
arboard = "3"
# The OS light/dark setting and its changes, to pick the day or night theme.
dark-light = { version = "3", default-features = false }
# Host details for the Debug page (OS version, CPU model, RAM). Only the
# `system` feature: no process, disk, network or user data.
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# The system locale and the IANA time zone name, for the Debug page; Slint
# and chrono already bring both crates in.
sys-locale = "0.3"
iana-time-zone = "0.1"
# Slint's defaults minus `system-tray`, which Cordiale doesn't use.
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
    # Files dropped on the window (`WindowEvent::DroppedFile`), which Slint
    # itself doesn't handle yet.
    "unstable-winit-030",
    # The shared font collection, to add symbol fonts to the font fallback.
    "unstable-fontique-011",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# Display width of the sidebar rows, for the sidebar's minimum width; Slint
# already brings the crate in.
unicode-width = "0.2.3"
# The private copy of a file waiting to be uploaded: a new file with a random
# name, readable by the owner only, deleted when dropped.
tempfile = "3"
# The radio player: MP3, Ogg Vorbis and FLAC streams, decoded the same way
# on every platform (ALSA on Linux, WASAPI on Windows, CoreAudio on macOS).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "vorbis", "flac"] }

# The in-app media player, all pure Rust and the same on every platform:
# containers and audio codecs (MP3, Vorbis, FLAC, WAV, AAC) from symphonia,
# Opus, H.264, HEVC/H.265, VP8, VP9 and AV1 from their own decoders. SVG is drawn by resvg,
# which runs no script and gets no external resolver.
symphonia = { version = "0.6", default-features = false, features = ["isomp4", "ogg", "mp3", "vorbis", "flac", "wav", "pcm", "aac"] }
opus-decoder = "0.1"
rusty_h265 = "0.7"
rusty_vp9 = "0.1"
# H.264, VP8 and AV1 (WebM video and AVIF stills), pure Rust with no assembly
# and no C: the assembly paths of the AV1 and H.264 crates are left off.
rusty_h264-decoder = { version = "0.17", default-features = false, features = ["std"] }
vp8-decoder = "0.1"
rusty_av1d = { version = "1.3", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
avif-parse = "2.1"
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }

# The taskbar overlay badge: the window handle and ITaskbarList3; the
# keyboard layout for the Debug page; the passkey ceremony's structs from
# webauthn.h, with webauthn.dll itself loaded at run time.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Passkeys on USB security keys (CTAP2 over HID) on Linux and macOS. Off by
# default: it builds hidapi's C code (libudev headers on Linux), which only
# the release builds would have to provide.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ctap-hid-fido2 = { version = "3.6", optional = true }

[features]
ctap-hid = ["dep:ctap-hid-fido2"]
# Shrinking videos before an upload: links FFmpeg through the core crate.
video-shrink = ["cordiale-core/video-shrink"]

# Random keys for the E2E history tests. vodozemac makes the test accounts
# of the key-request and SAS tests; the UI itself does no crypto.
[dev-dependencies]
chacha20poly1305 = "0.11"
vodozemac = "0.11.2"
# Reads the character map of the system symbol fonts in a test; Slint already
# brings the crate in.
ttf-parser = "0.25"
[build-dependencies]
slint-build = "1"
winresource = "0.1"
