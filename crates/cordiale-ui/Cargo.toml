[package]
name = "cordiale-ui"
version = "0.1.6"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
cordiale-core = { path = "../cordiale-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
rfd = "0.17"
# GIF, WebP and BMP let `slint::Image` (which decodes with this crate) load
# those avatars; PNG encodes images pasted from the clipboard.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "bmp", "png"] }
# Images and text on the system clipboard, for pasting uploads.
arboard = "3"
# Slint's defaults minus `system-tray`, which Cordiale doesn't use.
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    # Files dropped on the window (`WindowEvent::DroppedFile`), which Slint
    # itself doesn't handle yet.
    "unstable-winit-030",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"
