[package]
name = "cordiale-ui"
version = "0.1.4"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
cordiale-core = { path = "../cordiale-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
slint = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"
