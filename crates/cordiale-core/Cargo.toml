[package]
name = "cordiale-core"
version = "0.1.20"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
dirs = "7"
keyring = "4.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "multipart"] }
tokio = { version = "1", features = ["net", "macros", "rt", "time", "sync"] }
# The WebSocket must trust what REST (reqwest) trusts: the OS store through
# the platform verifier, so a server behind a private CA works on both. The
# `rustls-tls-native-roots` feature only switches the rustls support on; the
# connector is always built with the platform verifier (see `websocket.rs`).
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", features = ["sink"] }
# Video shrinking before an upload (`video_processing.rs`). Off by default:
# it links FFmpeg, which a build has to provide (system libraries, or the
# `static` feature of this crate to build them).
ffmpeg-next = { version = "9", optional = true }

[features]
video-shrink = ["dep:ffmpeg-next"]

[dev-dependencies]
wiremock = "0.6"
