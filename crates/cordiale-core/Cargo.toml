[package]
name = "cordiale-core"
version = "0.1.8"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
dirs = "7"
keyring = "4.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "multipart"] }
tokio = { version = "1", features = ["net", "macros", "rt", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
wiremock = "0.6"
